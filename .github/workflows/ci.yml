name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Resolve dependencies
        run: swift package resolve
      - name: Run XCTest suite
        run: swift test -Xswiftc -warnings-as-errors
      - name: Run standalone offline checks
        run: ./Scripts/run-offline-checks.sh
      - name: Confirm no legacy product or removed endpoint remains
        shell: bash
        run: |
          legacy_name="GLKB Cite""clip"
          legacy_type="GLKBCite""clip"
          legacy_id="org.glkb.""citeclip"
          removed_endpoint="hirn""-literature-api"
          pattern="$legacy_name|$legacy_type|$legacy_id|$removed_endpoint"
          ! grep -RIE "$pattern" --exclude-dir=.git --exclude-dir=.build .
